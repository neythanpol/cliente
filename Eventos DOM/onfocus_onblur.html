<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body onload="entrar()">
    <h1 id="titulo" >Manejo DOM con JavaScript</h1><br>
    Nombre: <input type="text" name="" id="" onfocus="cambiar(this)" onblur="regresar(this)"><br><br>
    Apellido: <input type="text" name="" id="" onfocus="cambiar(this)" onblur="regresar(this)">
    <script>
        function cambiar(elementoInput) {
            elementoInput.style.background = "yellow";
        }
        function regresar(elementoInput) {
            elementoInput.style.background = "white";
        }
    </script>
</body>
