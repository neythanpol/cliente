<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="titulo">Manejo DOM con JavaScript</h1>
    <button onclick="mostrar()">Mostrar</button><br>
    <img src="Imagenes/javascript.png" alt="" id="imagen">
    <script>
        function mostrar(){
            document.getElementById("imagen").src = "Imagenes/html5.png";
        }
    </script>
</body>
</html>
