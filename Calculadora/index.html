<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Aplicación Calculadora</title>
</head>
<body>
    <div class="container">
        <h1>Aplicación Calculadora</h1>
        <form action="" id="forma">
            <div class="mb-3">
                <label for="operandoA">Operando A</label>
                <input type="number" name="" id="operandoA" class="form-control" placeholder="Escribe operando A">
            </div>
            <div class="mb-3">
                <label for="operandoB">Operando B</label>
                <input type="number" name="" id="operandoB" class="form-control" placeholder="Escribe operando B">
            </div>
        </form>
        <button class="btn btn-primary mb-3" onclick="sumar()">Sumar</button>
        <div id="resultado">

        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
